<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page | NodeJS Assignment 2</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/home.html" class="logo">
                <div class="logo-icon">JS</div>
                <span class="logo-text">NodeJS Assignment 2</span>
            </a>
            <ul class="nav-links">
                <li><a href="/home.html">Home</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="pill-badge">📬 Contact</div>
        <h1 class="hero-title">Get in Touch</h1>
        <p class="hero-lead">
            Have questions or feedback about the NodeJS assignment implementation? Submit the form below.
        </p>

        <div class="form-card">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="Project Inquiry" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" class="form-control" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Shanku &bull; NodeJS Assignment 2 &bull; Deployed on Vercel</p>
    </footer>

    <div class="toast"></div>
    <script src="/script.js"></script>
</body>
</html>
